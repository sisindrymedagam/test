services:
  dokploy:
    build:
      # Context must be the repo root: the Dockerfile copies "dokploy/dokploy.csproj"
      context: .
      dockerfile: dokploy/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Set DEPLOY_ENVIRONMENT in Dokploy's Environment tab; overrides AppSettings:DeployEnvironment
      - AppSettings__DeployEnvironment=${DEPLOY_ENVIRONMENT:-not set in Dokploy}
    # The VPS is behind NAT: cloudclusters maps public 108.181.162.218:10004 -> VPS port 8080
    ports:
      - "8080:8080"
    # Domain routing via Traefik is configured in Dokploy's Domains tab (service: dokploy, port: 8080)
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
