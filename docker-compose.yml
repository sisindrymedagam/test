services:
  dokploy:
    build:
      # Context must be the repo root: the Dockerfile copies "dokploy/dokploy.csproj"
      context: .
      dockerfile: dokploy/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Set DEPLOY_ENVIRONMENT in Dokploy's Environment tab; overrides AppSettings:DeployEnvironment
      - AppSettings__DeployEnvironment=${DEPLOY_ENVIRONMENT:-not set in Dokploy}
    expose:
      - 8080
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.dokploy-web.rule=Host(`a-beszel-d073ee-31-220-108-27.traefik.me`)
      - traefik.http.routers.dokploy-web.entrypoints=web
      - traefik.http.routers.dokploy-web.service=dokploy-web
      - traefik.http.services.dokploy-web.loadbalancer.server.port=8080

networks:
  dokploy-network:
    external: true
